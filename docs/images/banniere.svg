<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Québec en mouvement</title>
  <desc id="d">Bannière : le tracé du tramway en jaune sur un plan de rues de nuit, avec des bus en bleu, des Cybercab en rose et des autos en gris.</desc>
  <defs>
    <linearGradient id="nuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1522"/>
      <stop offset="1" stop-color="#1c2b3d"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1522" stop-opacity=".96"/>
      <stop offset=".62" stop-color="#0c1522" stop-opacity=".8"/>
      <stop offset=".9" stop-color="#0c1522" stop-opacity="0"/>
    </linearGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="1280" height="340" rx="14" fill="url(#nuit)"/>

  <!-- le fleuve -->
  <path d="M700 340 C 820 300, 930 250, 1040 150 S 1220 20, 1280 0 V 340 Z" fill="#101d2e"/>
  <path d="M760 340 C 880 300, 990 250, 1100 150 S 1250 40, 1280 26 V 340 Z" fill="#0a121d"/>

  <!-- les rues -->
  <g fill="none" stroke="#2b3d54" stroke-width="2" stroke-linecap="round">
    <path d="M430 40 L 1010 120"/><path d="M400 120 L 930 210"/><path d="M380 215 L 820 300"/>
    <path d="M520 10 L 470 330"/><path d="M640 10 L 600 330"/><path d="M770 20 L 720 330"/><path d="M900 40 L 850 300"/>
    <path d="M430 300 L 980 40"/><path d="M560 330 L 1080 90"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M400 70 L 1100 60" stroke="#3a516e" stroke-width="5"/>
    <path d="M430 262 L 940 150" stroke="#3a516e" stroke-width="5"/>
    <path d="M400 70 L 1100 60" stroke="#ff4d4f" stroke-width="2" stroke-dasharray="46 30" opacity=".75"/>
    <path d="M430 262 L 940 150" stroke="#ffb020" stroke-width="2" stroke-dasharray="30 44" opacity=".7"/>
  </g>

  <!-- le tracé du tramway -->
  <path id="trace" d="M455 300 L 520 286 L 590 300 L 650 262 L 720 246 L 790 210 L 850 178 L 905 150 L 930 118 L 900 92 L 872 70 L 850 44" fill="none" stroke="#ffc83d" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#halo)" opacity=".5"/>
  <path d="M455 300 L 520 286 L 590 300 L 650 262 L 720 246 L 790 210 L 850 178 L 905 150 L 930 118 L 900 92 L 872 70 L 850 44" fill="none" stroke="#ffc83d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#0c1522" stroke="#ffc83d" stroke-width="3">
    <circle cx="455" cy="300" r="7"/><circle cx="590" cy="300" r="5"/><circle cx="650" cy="262" r="7"/><circle cx="720" cy="246" r="5"/>
    <circle cx="790" cy="210" r="5"/><circle cx="850" cy="178" r="5"/><circle cx="905" cy="150" r="5"/><circle cx="930" cy="118" r="7"/>
    <circle cx="900" cy="92" r="5"/><circle cx="850" cy="44" r="7"/>
  </g>

  <!-- les véhicules -->
  <g fill="#cdd8e6" opacity=".85">
    <circle cx="470" cy="69" r="2.5"/><circle cx="505" cy="68.5" r="2.5"/><circle cx="560" cy="67.7" r="2.5"/><circle cx="640" cy="66.6" r="2.5"/>
    <circle cx="700" cy="65.7" r="2.5"/><circle cx="748" cy="65" r="2.5"/><circle cx="820" cy="64" r="2.5"/><circle cx="980" cy="61.7" r="2.5"/>
    <circle cx="480" cy="251" r="2.5"/><circle cx="540" cy="238" r="2.5"/><circle cx="615" cy="221" r="2.5"/><circle cx="700" cy="203" r="2.5"/>
    <circle cx="512" cy="92" r="2.5"/><circle cx="494" cy="205" r="2.5"/><circle cx="628" cy="110" r="2.5"/><circle cx="757" cy="100" r="2.5"/>
    <circle cx="600" cy="220" r="2.5"/><circle cx="680" cy="182" r="2.5"/><circle cx="760" cy="244" r="2.5"/><circle cx="870" cy="190" r="2.5"/>
  </g>
  <g fill="#52b6ff">
    <circle cx="560" cy="145" r="4"/><circle cx="690" cy="168" r="4"/><circle cx="820" cy="190" r="4"/>
  </g>
  <g fill="#ff5c93">
    <circle cx="610" cy="288" r="3.5"/><circle cx="685" cy="254" r="3.5"/><circle cx="756" cy="228" r="3.5"/><circle cx="826" cy="190" r="3.5"/>
    <circle cx="918" cy="134" r="3.5"/><circle cx="884" cy="80" r="3.5"/><circle cx="960" cy="150" r="3.5"/><circle cx="1010" cy="124" r="3.5"/>
  </g>

  <!-- le titre -->
  <rect width="1280" height="340" rx="14" fill="url(#voile)"/>
  <g font-family="'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif">
    <text x="56" y="150" font-size="60" font-weight="700" fill="#eef3f8" letter-spacing=".5">Québec en mouvement</text>
    <text x="58" y="194" font-size="23" fill="#9fb0c3" font-family="'Barlow Semi Condensed','Segoe UI',Arial,sans-serif">Une journée de transport rejouée sur les vraies rues de Québec</text>
  </g>
  <g font-family="'Barlow Semi Condensed','Segoe UI',Arial,sans-serif" font-size="21" fill="#eef3f8">
    <rect x="58" y="238" width="30" height="6" rx="3" fill="#ffc83d"/><text x="98" y="248">Tramway</text>
    <rect x="206" y="238" width="30" height="6" rx="3" fill="#52b6ff"/><text x="246" y="248">Bus</text>
    <rect x="306" y="238" width="30" height="6" rx="3" fill="#ff5c93"/><text x="346" y="248">Cybercab</text>
    <rect x="456" y="238" width="30" height="6" rx="3" fill="#cdd8e6"/><text x="496" y="248">Autos</text>
  </g>
</svg>
