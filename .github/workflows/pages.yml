# Teste le moteur, puis publie le dossier web/ sur GitHub Pages.
# À activer une fois dans le dépôt : Settings > Pages > Source : GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/engine.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # pour retrouver l'archive du site envoyée par ce même flux
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
